name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Preview and production jobs both mutate the same gh-pages branch.
concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: pnpm run build
      - name: Build website
        run: pnpm --dir website run build
        env:
          BASE_PATH: /rifm/
      - name: Publish production site
        run: bash .github/scripts/publish-pages.sh production website/dist
